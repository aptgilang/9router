services:
  9router:
    build: .
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - "9router-data:/app/data"
    environment:
      - DATA_DIR=/app/data
      - LOG_PAYLOAD=true
      - REDACT_LOGS=false
      - ENABLE_REQUEST_LOGS=true
      - OBSERVABILITY_MAX_RECORDS=200
      - OBSERVABILITY_MAX_JSON_SIZE=2048
      - NODE_OPTIONS=--max-old-space-size=1024

volumes:
  9router-data:
