services:
  9router:
    build: .
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - "9router-data:/app/data"
    environment:
      - DATA_DIR=/app/data
      - LOG_PAYLOAD=true
      - REDACT_LOGS=false
      - ENABLE_REQUEST_LOGS=true

volumes:
  9router-data:
